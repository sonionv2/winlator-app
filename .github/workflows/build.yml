name: Build APK

on:
  push:
    branches: [ main, thor-8gb-tuning ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; just add the pinned NDK and CMake.
      - name: Install NDK and CMake versions the project pins
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;24.0.8215888" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set. This APK gets a random key and can't update a previous build."
          else
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/winlator8.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/winlator8.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: winlator8-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
